<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura Desacoplada AWS v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
  <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-8 space-y-6">
    <div class="space-y-2 text-center">
      <span class="inline-block px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-xs font-semibold tracking-wider uppercase">
        S3 + CloudFront + EC2 + RDS PostgreSQL
      </span>
      <h1 class="text-3xl font-extrabold tracking-tight text-white">Arquitectura Cloud AWS</h1>
      <p class="text-slate-400 text-sm">Frontend estático desacoplado consumiendo API contenerizada con Docker detrás de Nginx.</p>
    </div>

    <div class="bg-slate-950/60 rounded-xl p-5 border border-slate-800 space-y-3">
      <div class="flex items-center justify-between text-sm">
        <span class="text-slate-400">Estado de la Base de Datos:</span>
        <span id="db-status" class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
          Consultando...
        </span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="text-slate-400">Mensaje de la API:</span>
        <span id="api-message" class="text-slate-300 font-mono text-xs">Cargando...</span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="text-slate-400">Hora del Servidor RDS:</span>
        <span id="db-time" class="text-slate-300 font-mono text-xs">--</span>
      </div>
    </div>

    <button id="btn-refresh" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 text-sm">
      Reconsultar API (/api/test)
    </button>
  </div>

  <script>
    async function checkApi() {
      const statusEl = document.getElementById('db-status');
      const messageEl = document.getElementById('api-message');
      const timeEl = document.getElementById('db-time');

      statusEl.className = "px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20";
      statusEl.textContent = "Consultando...";

      try {
        const res = await fetch('/api/test');
        const data = await res.json();

        if (res.ok) {
          statusEl.className = "px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
          statusEl.textContent = "Conectado a PostgreSQL";
          messageEl.textContent = data.message || "OK";
          timeEl.textContent = data.now || data.time || new Date().toLocaleTimeString();
        } else {
          throw new Error(data.error || "Respuesta con error");
        }
      } catch (err) {
        statusEl.className = "px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20";
        statusEl.textContent = "Error de Conexión";
        messageEl.textContent = err.message;
        timeEl.textContent = "--";
      }
    }

    document.getElementById('btn-refresh').addEventListener('click', checkApi);
    checkApi();
  </script>
</body>
</html>
